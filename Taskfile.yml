version: '3'

vars:
  # APP_NAME is the executable (bin/pisar, used by scripts/); BUNDLE_NAME is the .app shown to the user.
  APP_NAME: "pisar"
  BUNDLE_NAME: "Pisar"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  icon:
    summary: Regenerates build/appicon.png, icons.icns and Assets.car from build/appicon.svg
    desc: |
      build/appicon.svg is the full icon (with backing); build/appicon.icon holds the Icon Composer layers.
      The PNG is drawn by sips, so another macOS version may produce different bytes.
    platforms: [darwin]
    preconditions:
      - sh: test -f build/appicon.svg
        msg: "build/appicon.svg is missing."
    cmds:
      - sips -s format png build/appicon.svg --out build/appicon.png
      - task: common:generate:icons

  sign:
    summary: Signs bin/{{.BUNDLE_NAME}}.app with the stable identity in $SIGN_IDENTITY (never ad-hoc)
    desc: |
      Usage: SIGN_IDENTITY="<name of a code-signing identity>" task sign
      List identities with: security find-identity -v -p codesigning
    deps: [package]
    platforms: [darwin]
    preconditions:
      - sh: test -n "$SIGN_IDENTITY"
        msg: "SIGN_IDENTITY is not set. Export the name of a code-signing identity (see `security find-identity -v -p codesigning`)."
    cmds:
      - xattr -cr "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app"
      - codesign --force --deep --options runtime --sign "$SIGN_IDENTITY" "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app"
      - codesign --verify --deep --strict "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app"

  # Go packages embed frontend/dist, so every Go check needs the frontend built first.
  test:
    summary: Runs all Go tests and the frontend unit tests
    deps: [common:build:frontend]
    cmds:
      - go test ./...
      - task: test:frontend

  test:race:
    summary: Runs all Go tests with the race detector
    deps: [common:build:frontend]
    cmds:
      - go test -race ./...

  test:frontend:
    summary: Runs the frontend unit tests (vitest)
    dir: frontend
    deps: [common:install:frontend:deps]
    cmds:
      - npm test

  lint:
    summary: Runs golangci-lint and the frontend type check
    deps: [common:build:frontend]
    cmds:
      - golangci-lint run ./...
      - task: lint:frontend

  lint:frontend:
    summary: Type-checks the Svelte frontend
    dir: frontend
    deps: [common:install:frontend:deps]
    cmds:
      - npm run check

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
